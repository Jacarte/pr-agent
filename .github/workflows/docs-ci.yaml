name: docs-ci
on:
  push:
    branches:
      - main
      - add-docs-portal
    paths:
      - docs/**
  pull_request:
    paths:
      - docs/**
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      # The build fails on broken links and anchors, so this is the gate that keeps
      # a bad docs change from reaching main. It runs on pull requests too.
      - run: npm run build
        working-directory: docs
      - name: Verify documentation URLs referenced from the codebase still resolve
        run: python3 scripts/check_docs_urls.py
